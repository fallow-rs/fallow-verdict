name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm test
      - run: npm run build
      - name: Schemas are up to date
        run: npm run schemas && git diff --exit-code schemas
      - name: Packed CLI starts
        run: |
          npm pack --silent
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm i --silent "$GITHUB_WORKSPACE"/fallow-verdict-*.tgz
          npx fallow-verdict --version
