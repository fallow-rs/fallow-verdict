name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - name: Comments describe the code as it is now
        run: |
          node --test scripts/check-comment-quality.test.mjs
          node scripts/check-comment-quality.mjs --all
      - run: npm test
      - run: npm run build
      - name: Evaluation inputs match their frozen labels and questions
        run: |
          npm run eval:compare -- --dataset development --dry-run
          npm run eval:compare -- --dataset holdout --dry-run
      - name: Schemas are up to date
        run: npm run schemas && git diff --exit-code schemas
      - name: Packed CLI and public imports work in a clean installation
        run: npm run verify:package

  workflows:
    name: Workflow syntax and security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: uvx zizmor@1.26.1 --min-confidence medium --format plain .github/workflows
