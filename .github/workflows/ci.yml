name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm test
      - run: npm run build
      - name: Evaluation inputs match their frozen labels and questions
        run: |
          npm run eval:compare -- --dataset development --dry-run
          npm run eval:compare -- --dataset holdout --dry-run
      - name: Schemas are up to date
        run: npm run schemas && git diff --exit-code schemas
      - name: Packed CLI starts
        run: |
          npm pack --silent
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm i --silent "$GITHUB_WORKSPACE"/fallow-verdict-*.tgz
          npx fallow-verdict --version
